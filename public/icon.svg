<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#000000"/>
  <g stroke="#ffffff" stroke-linecap="square">
    <!-- nut -->
    <line x1="96" y1="148" x2="416" y2="148" stroke-width="14"/>
    <!-- frets -->
    <line x1="96" y1="220" x2="416" y2="220" stroke-width="4"/>
    <line x1="96" y1="292" x2="416" y2="292" stroke-width="4"/>
    <line x1="96" y1="364" x2="416" y2="364" stroke-width="4"/>
    <line x1="96" y1="436" x2="416" y2="436" stroke-width="4"/>
    <!-- strings -->
    <line x1="96" y1="148" x2="96" y2="436" stroke-width="3"/>
    <line x1="160" y1="148" x2="160" y2="436" stroke-width="3"/>
    <line x1="224" y1="148" x2="224" y2="436" stroke-width="3"/>
    <line x1="288" y1="148" x2="288" y2="436" stroke-width="3"/>
    <line x1="352" y1="148" x2="352" y2="436" stroke-width="3"/>
    <line x1="416" y1="148" x2="416" y2="436" stroke-width="3"/>
  </g>
  <!-- finger dots in a C shape pattern -->
  <g fill="#ffffff">
    <circle cx="160" cy="328" r="22"/>
    <circle cx="224" cy="256" r="22"/>
    <circle cx="352" cy="184" r="22"/>
  </g>
</svg>
